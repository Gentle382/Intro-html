<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My portfolio">
  <title>My Portfolio</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #fff; background: radial-gradient(ellipse at 20% 10%, #7747d8 0, transparent 42%), linear-gradient(135deg, #17122e, #30205d 55%, #5d2e85); }
    main { width: min(100%, 720px); padding: clamp(32px, 8vw, 72px); text-align: center; border: 1px solid rgb(255 255 255 / 22%); border-radius: 28px; background: rgb(255 255 255 / 8%); box-shadow: 0 24px 80px rgb(0 0 0 / 24%); backdrop-filter: blur(14px); }
    .eyebrow { margin: 0 0 14px; color: #d7c8ff; font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.6rem, 9vw, 5rem); line-height: 1; letter-spacing: -.055em; }
    .intro { max-width: 460px; margin: 22px auto 32px; color: #e1dcf2; font-size: 1.08rem; line-height: 1.7; }
    .artifact-link { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 24px; border-radius: 999px; color: #231643; background: #fff; font-weight: 700; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }
    .artifact-link:hover, .artifact-link:focus-visible { transform: translateY(-2px); box-shadow: 0 10px 28px rgb(0 0 0 / 24%); }
    .back-link { display: inline-block; margin-top: 28px; color: #d7c8ff; font-size: .95rem; text-decoration: none; }
    .back-link:hover, .back-link:focus-visible { color: #fff; text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little about my work</p>
    <h1>My Portfolio</h1>
    <p class="intro">Explore my portfolio and projects in the interactive page I created.</p>
    <a class="artifact-link" href="https://claude.ai/artifact/AsvCvAJ9bV7cULH3DskUDP" target="_blank" rel="noopener noreferrer">View my portfolio</a>
    <br>
    <a class="back-link" href="index.html">Back to the homepage</a>
  </main>
</body>
</html>
